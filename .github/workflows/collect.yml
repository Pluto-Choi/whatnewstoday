name: Collect Daily Keywords

on:
  # 정시 실행은 Vercel Cron(app/api/cron/collect)이 05시대·17시대 KST에 workflow_dispatch로 깨운다.
  # GitHub schedule은 몇 시간씩 늦게 떠서 백업으로만 둔다(아래 guard가 이미 수집됐으면 건너뜀).
  schedule:
    - cron: '30 21 * * *'  # 06:30 KST (UTC 21:30)
    - cron: '30 9 * * *'   # 18:30 KST (UTC 09:30)
  workflow_dispatch:

# 수집은 한 번에 하나만: dispatch가 겹치거나 백업과 동시에 떠도 앞 실행을 끊지 않고 뒤에서 기다린다.
concurrency:
  group: collect
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - name: 최근 정시 슬롯 이후 수집됐는지 확인
        id: check
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timedelta, timezone
          KST = timezone(timedelta(hours=9))
          now = datetime.now(KST)
          # 가장 최근 정시 슬롯(05시·17시 KST). 그 뒤에 수집된 데이터가 있으면 백업은 쉰다.
          slots = [d.replace(hour=h, minute=0, second=0, microsecond=0)
                   for d in (now, now - timedelta(days=1)) for h in (5, 17)]
          slot = max(s for s in slots if s <= now)
          data = json.load(open('data/keywords.json', encoding='utf-8'))
          updated = datetime.strptime(data['updated_at'], '%Y-%m-%d %H:%M').replace(tzinfo=KST)
          print(f"skip={'true' if updated >= slot else 'false'}")
          PY

  collect:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # pip 캐시: 키가 requirements 해시라 버전을 바꾸면 새로 저장된다(고정 키는 처음 저장본에 갇혔음).
          cache: pip
          cache-dependency-path: requirements-collect.txt

      - name: HuggingFace 모델 캐시 (modu-ner 재다운로드 방지)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-Leo97-modu-ner-v1

      - name: 라이브러리 설치
        run: pip install -r requirements-collect.txt

      - name: 키워드 수집 실행
        run: python collect.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: 수집 결과 검증
        run: |
          python -c "
          import json, sys
          data = json.load(open('data/keywords.json', encoding='utf-8'))
          cats = data.get('categories', {})
          if len(cats) < 2:
              print('ERROR: 카테고리가 2개 미만입니다')
              sys.exit(1)
          # AI 단계가 통째로 실패(크레딧·키 만료)하면 형식은 멀쩡해도 설명·브리핑이 빈다 → 배포·게시 막기
          b = data.get('briefing') or {}
          if not (b.get('text') if isinstance(b, dict) else b):
              print('ERROR: 브리핑이 비어 있습니다')
              sys.exit(1)
          kws_all = [k for c in cats.values() for k in c.get('keywords', [])]
          filled = sum(1 for k in kws_all if (k.get('description') or '').strip()) / max(len(kws_all), 1)
          if filled < 0.7:
              print(f'ERROR: 설명이 채워진 키워드가 {filled:.0%}로 70% 미만입니다')
              sys.exit(1)
          for name, cat in cats.items():
              kws = cat.get('keywords', [])
              if len(kws) < 3:
                  print(f'ERROR: {name} 키워드가 {len(kws)}개로 부족합니다')
                  sys.exit(1)
              for kw in kws:
                  if not kw.get('articles'):
                      print(f'WARNING: {name}/{kw[\"word\"]}에 기사가 없습니다')
          print(f'OK: {len(cats)}개 카테고리, 총 {sum(len(c[\"keywords\"]) for c in cats.values())}개 키워드')
          "

      - name: 결과 저장 (Git commit + push)
        id: push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # -A: collect.py가 보관 기간(365일) 지난 history를 지우므로 삭제도 스테이징
          git add -A data/
          git commit -m "Update keywords $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')" || { echo "변경사항 없음"; exit 0; }

          # 충돌 방지: 최대 3회 재시도. 다 실패하면 스텝을 실패로 끝낸다(예전엔 마지막 sleep 때문에 성공으로 떴음).
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push 재시도 ($i/3)..."
            sleep 5
          done
          echo "::error::push 3회 모두 실패"
          exit 1

      # 수집 성공 직후 급상승 본문 생성 루틴을 즉시 호출(이벤트 체이닝).
      # 고정 시각 추측 대신 키워드가 푸시된 그 순간 본문이 따라붙는다.
      - name: 급상승 본문 생성 루틴 호출 (fire)
        env:
          ROUTINE_FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}
          ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
        run: |
          if [ -z "$ROUTINE_FIRE_TOKEN" ] || [ -z "$ROUTINE_FIRE_URL" ]; then
            echo "ROUTINE_FIRE_* 미설정 — 본문 루틴 호출 건너뜀"; exit 0
          fi
          curl -fsS -X POST "$ROUTINE_FIRE_URL" \
            -H "Authorization: Bearer $ROUTINE_FIRE_TOKEN" \
            -H "anthropic-version: 2023-06-01" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "Content-Type: application/json" \
            -d '{"text": "키워드 수집 완료 — 급상승 본문 생성해줘."}'

      # 게시는 push 뒤에: 새 키워드 페이지는 재배포 전까지 404라 링크 첨부가 실패했었다.
      # post_threads.py가 키워드 페이지가 열릴 때까지 기다렸다 게시하고, 실패하면 1회 재시도 후 스텝을 실패로 끝낸다.
      - name: Threads 자동 게시
        id: threads
        if: ${{ !cancelled() && steps.push.outcome == 'success' }}
        run: python post_threads.py
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # 중복 게시 방지용 상태만 따로 커밋. vercel.json ignoreCommand가 이 파일만 바뀐 커밋은 빌드하지 않는다.
      - name: Threads 상태 저장
        if: ${{ !cancelled() && steps.push.outcome == 'success' }}
        run: |
          git add data/threads_state.json
          git diff --cached --quiet && { echo "상태 변경 없음"; exit 0; }
          git commit -m "Update threads state"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          echo "::error::threads_state push 3회 모두 실패"
          exit 1

      # 새 키워드 페이지를 네이버·Bing에 바로 알린다(IndexNow). 재배포 반영을 기다렸다 핑.
      # Threads 게시가 실패해도 색인 요청은 보낸다.
      - name: IndexNow 색인 요청
        if: ${{ !cancelled() && steps.push.outcome == 'success' }}
        continue-on-error: true
        run: python indexnow_ping.py
